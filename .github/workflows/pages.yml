name: Deploy download page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage website without repository metadata
        run: |
          mkdir "$RUNNER_TEMP/site"
          for name in index.html download.js style.css icon.svg racing.png release.json release.signed.json service.json service.signed.json content.signed.json SHA256SUMS.txt THIRD_PARTY.md .nojekyll; do
            if [ -f "$name" ]; then cp "$name" "$RUNNER_TEMP/site/"; fi
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
